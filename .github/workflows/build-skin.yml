name: Build Glass Dark skin APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build APK
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew :glass_skin:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: poweramp-glass-dark-apk
          path: glass_skin/build/outputs/apk/debug/*.apk
